[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "david-canonical"
version = "0.1.0"
description = "DAVID/M0.1 canonical forward-prediction engine and automated ingestion."
authors = [{name = "Arben Lila"}]
requires-python = ">=3.11"
dependencies = [
    "cmdstanpy>=1.2",
    "numpy>=1.26",
    "pandas>=3.0.4",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.5",
    "httpx>=0.27",
    "feedparser>=6.0",
    "tenacity>=8.2",
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.29",
    "typer>=0.26.8",
    "rich>=13.7",
    "anthropic>=0.112.0",
    "groq>=1.5.0",
    "psycopg2-binary>=2.9",
    "arviz>=0.23.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.155.7",
    "mypy>=1.10",
    "ruff>=0.15.20",
]
llm = [
    # Plug in whichever providers you use
    "anthropic>=0.112.0",
    "openai>=2.44.0",
]

[project.scripts]
david = "david.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["david*"]
