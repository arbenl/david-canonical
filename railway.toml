[build]
# build.sh: uv sync → install CmdStan to /opt/cmdstan → pre-compile Stan binary.
# The compiled binary is baked into the image so runtime never needs CmdStan.
buildCommand = "bash build.sh"

[deploy]
startCommand = "uvicorn david.api.server:api --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
releaseCommand = "david db init"
