[build]
# Install CmdStan (Stan C++ backend) during build so it's baked into the image.
# Nixpacks auto-runs `uv sync --locked --no-editable` before this step.
buildCommand = "uv run python -c \"import cmdstanpy; cmdstanpy.install_cmdstan()\""

[deploy]
startCommand = "uvicorn david.api.server:api --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
releaseCommand = "david db init"
