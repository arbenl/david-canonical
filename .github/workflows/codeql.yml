name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-disabled:
    name: CodeQL unavailable
    if: vars.CODEQL_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain CodeQL status
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## CodeQL skipped

          CodeQL upload requires GitHub code scanning to be enabled for this
          private repository. SonarQube Cloud is the required quality and
          security gate for this branch.

          To enable this workflow later:

          1. Enable code scanning / GitHub Advanced Security for the repository.
          2. Set repository variable `CODEQL_ENABLED=true`.
          MD

  analyze:
    name: CodeQL (${{ matrix.language }})
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
