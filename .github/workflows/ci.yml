name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  CMDSTAN_VERSION: "2.39.0"

jobs:
  python-tests:
    name: Python deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Restore CmdStan cache
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ env.CMDSTAN_VERSION }}

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Ensure CmdStan is available
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import cmdstanpy

          version = "${{ env.CMDSTAN_VERSION }}"
          expected = Path.home() / ".cmdstan" / f"cmdstan-{version}"
          if not (expected / "bin" / "stanc").exists():
              cmdstanpy.install_cmdstan(version=version, cores=2, progress=False)
          cmdstanpy.set_cmdstan_path(str(expected))
          print(cmdstanpy.cmdstan_path())
          PY

      - name: Validate JSON configuration
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("config").glob("*.json")):
              with path.open() as fh:
                  json.load(fh)
              print(f"validated {path}")
          PY

      - name: Run pytest suite
        run: uv run pytest tests -q

  ui-build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: david-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: david-ui
        run: npm ci

      - name: Build UI
        working-directory: david-ui
        run: npm run build

  quality-advisory:
    name: Python quality advisory
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff advisory
        continue-on-error: true
        run: uv run ruff check .

      - name: Mypy advisory
        continue-on-error: true
        run: uv run mypy david

      - name: Advisory summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Quality Advisory

          `ruff` and `mypy` are intentionally advisory until the current codebase
          debt is burned down. Do not merge a thesis-critical PR with newly
          introduced lint/type regressions; compare these logs against the base
          branch and fix new findings before requesting Copilot/Sonar review.
          MD

