name: SonarQube

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  CMDSTAN_VERSION: "2.39.0"
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

jobs:
  sonar:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Sonar configuration
        id: sonar-config
        shell: bash
        run: |
          if [[ -n "$SONAR_PROJECT_KEY" && -n "$SONAR_ORGANIZATION" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sonar scan skipped. Configure SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: steps.sonar-config.outputs.enabled == 'true'
        run: python -m pip install --upgrade pip uv

      - name: Restore CmdStan cache
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ env.CMDSTAN_VERSION }}

      - name: Install Python dependencies
        if: steps.sonar-config.outputs.enabled == 'true'
        run: uv sync --extra dev --frozen

      - name: Ensure CmdStan is available
        if: steps.sonar-config.outputs.enabled == 'true'
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import cmdstanpy

          version = "${{ env.CMDSTAN_VERSION }}"
          expected = Path.home() / ".cmdstan" / f"cmdstan-{version}"
          if not (expected / "bin" / "stanc").exists():
              cmdstanpy.install_cmdstan(version=version, cores=2, progress=False)
          cmdstanpy.set_cmdstan_path(str(expected))
          print(cmdstanpy.cmdstan_path())
          PY

      - name: Generate Python coverage
        if: steps.sonar-config.outputs.enabled == 'true'
        run: uv run pytest tests -q --cov=david --cov-report=xml

      - name: Set up Node.js
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: david-ui/package-lock.json

      - name: Build UI
        if: steps.sonar-config.outputs.enabled == 'true'
        working-directory: david-ui
        run: |
          npm ci
          npm run build

      - name: Run SonarQube scan
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Sonar skip summary
        if: steps.sonar-config.outputs.enabled != 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## SonarQube skipped

          Configure these repository settings to activate the required quality gate:

          - Secret: `SONAR_TOKEN`
          - Variable: `SONAR_PROJECT_KEY`
          - Variable: `SONAR_ORGANIZATION`

          Once enabled, make this workflow a required status check for protected
          branches and do not merge with a failing quality gate.
          MD
