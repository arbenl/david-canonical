version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      python-patch-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /david-ui
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
    open-pull-requests-limit: 5
    labels: [dependencies, ui]
    groups:
      ui-patch-minor:
        update-types: [minor, patch]

