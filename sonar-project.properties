sonar.projectName=DAVID Canonical
sonar.sourceEncoding=UTF-8

sonar.sources=david,david-ui/src,stan,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=\
  **/.next/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  data/**,\
  docs/archive/**,\
  docs/**/*.pdf,\
  docs/**/*.log,\
  **/*.parquet,\
  uv.lock,\
  david-ui/package-lock.json

sonar.coverage.exclusions=\
  tests/**,\
  docs/**,\
  scripts/**,\
  stan/**,\
  david-ui/src/app/api/**

